services:
  # PostgreSQL Database - Single instance with multiple databases
  postgres:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Kafka Init - Create topics
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      sleep 10
      
      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic post-events --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic comment-events --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic like-event --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic user-events --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic chat-messages --partitions 3 --replication-factor 1
      
      echo 'Kafka topics created successfully!'
      kafka-topics --list --bootstrap-server kafka:29092
      "

  # Eureka Discovery Service
  discovery-service:
    build:
      context: ./Services/discovery_service
      dockerfile: DockerFile
    container_name: discovery-service
    environment:
      - PORT=8761
      - EUREKA_HOSTNAME=discovery-service
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Auth Service
  auth-service:
    build:
      context: ./Services/auth_service
      dockerfile: DockerFile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8061
      - DB_URL=jdbc:postgresql://postgres:5432/socialmedia_auth
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8061:8061"
    networks:
      - microservices-network

  # User Service
  user-service:
    build:
      context: ./Services/user_service
      dockerfile: DockerFile
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8082
      - DB_URL=jdbc:postgresql://postgres:5432/socialmedia_users
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - microservices-network

  # Post Service
  post-service:
    build:
      context: ./Services/post_service
      dockerfile: DockerFile
    container_name: post-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8083
      - DB_URL=jdbc:postgresql://postgres:5432/socialmedia_posts
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - CLOUD_NAME=default_cloud_name
      - API_KEY=default_api_key
      - API_SECRET=default_api_secret
    ports:
      - "8083:8083"
    networks:
      - microservices-network

  # Comment Service
  comment-service:
    build:
      context: ./Services/comment_service
      dockerfile: DockerFile
    container_name: comment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8084
      - DB_URL=jdbc:postgresql://postgres:5432/socialmedia_comments
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8084:8084"
    networks:
      - microservices-network

  # Like Service
  like-service:
    build:
      context: ./Services/like_service
      dockerfile: DockerFile
    container_name: like-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8085
      - DB_URL=jdbc:postgresql://postgres:5432/socialmedia_likes
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8085:8085"
    networks:
      - microservices-network

  # Chat Service
  chat-service:
    build:
      context: ./Services/chat-service
      dockerfile: DockerFile
    container_name: chat-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8086
      - DB_URL=jdbc:postgresql://postgres:5432/socialmedia_chat
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8086:8086"
    networks:
      - microservices-network

  # Notification Service
  notification-service:
    build:
      context: ./Services/notification_service
      dockerfile: DockerFile
    container_name: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8087
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/socialmedia_notifications
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8087:8087"
    networks:
      - microservices-network

  # API Gateway
  api-gateway:
    build:
      context: ./Services/api_gateway
      dockerfile: DockerFile
    container_name: api-gateway
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - PORT=8080
      - JWT_SECRET=FSO66lU+9FB4WKbafCVfacWWK10IVxzayT20I15GMHE=
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8080:8080"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  pgdata: